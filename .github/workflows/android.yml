name: Android NDK Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build SDL2 for Android
        run: |
          cd /tmp
          git clone https://github.com/libsdl-org/SDL.git sdl2_src -b SDL2 --depth=1
          mkdir sdl2_build
          cd sdl2_build
          cmake ../sdl2_src \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DBUILD_SHARED_LIBS=ON \
            -DLIBSDL2Tests=OFF \
            -DCMAKE_INSTALL_PREFIX=/tmp/sdl2_install
          cmake --build . --parallel
          cmake --install .

          # Verify what was installed
          find /tmp/sdl2_install -type f | head -20

      - name: Configure
        run: |
          SDL2_CMAKE_DIR=$(find /tmp/sdl2_install -name "SDL2Config.cmake" 2>/dev/null | head -1 | xargs dirname)
          SDL2_INCLUDE=$(find /tmp/sdl2_install -name "SDL.h" 2>/dev/null | head -1 | xargs dirname)
          SDL2_LIB=$(find /tmp/sdl2_install -name "libSDL2*.so" 2>/dev/null | head -1)
          echo "SDL2 cmake dir: $SDL2_CMAKE_DIR"
          echo "SDL2 include: $SDL2_INCLUDE"
          echo "SDL2 lib: $SDL2_LIB"
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DGGMORSE_BUILD_EXAMPLES=ON \
            -DSDL2_DIR="$SDL2_CMAKE_DIR" \
            -DSDL2_INCLUDE_DIRS="$SDL2_INCLUDE" \
            -DSDL2_LIBRARIES="$SDL2_LIB" \
            -DSDL2_TESTS=OFF \
            -DSDL2_INSTALL_TESTS=OFF \
            -DGGMORSE_BUILD_TESTS=OFF

      - name: Build
        run: |
          cmake --build build --parallel --clean-first 2>&1 | tail -80

      - name: Package APK
        run: |
          mkdir -p apk_out
          find build -name "*.so" -exec echo {} \;
          ls build/examples/ggmorse-gui/ 2>/dev/null || ls build/ 2>/dev/null
