name: Android NDK Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Get submodules
        run: |
          git submodule update --init --recursive

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DGGMorse_BUILD_EXAMPLES=ON

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Package APK
        run: |
          mkdir -p apk
          cp build/examples/ggmorse-gui/*.so apk/ 2>/dev/null || true
          ls build/examples/ggmorse-gui/ || true
          find build -name "*.so" -exec echo {} \;
