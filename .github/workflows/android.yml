name: Android NDK Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build SDL2 for Android
        run: |
          cd /tmp
          git clone https://github.com/libsdl-org/SDL.git sdl2_src -b SDL2 --depth=1
          mkdir sdl2_build
          cd sdl2_build
          cmake ../sdl2_src \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DBUILD_SHARED_LIBS=ON \
            -DLIBSDL2Tests=OFF \
            -DCMAKE_INSTALL_PREFIX=/tmp/sdl2_install
          cmake --build . --parallel
          cmake --install .

          # Verify what was installed
          find /tmp/sdl2_install -type f | head -20

      - name: Configure
        run: |
          SDL2_CMAKE_DIR=$(find /tmp/sdl2_install -name "SDL2Config.cmake" 2>/dev/null | head -1 | xargs dirname)
          SDL2_INCLUDE=$(find /tmp/sdl2_install -name "SDL.h" 2>/dev/null | head -1 | xargs dirname)
          SDL2_LIB=$(find /tmp/sdl2_install -name "libSDL2*.so" 2>/dev/null | head -1)
          echo "SDL2 cmake dir: $SDL2_CMAKE_DIR"
          echo "SDL2 include: $SDL2_INCLUDE"
          echo "SDL2 lib: $SDL2_LIB"
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DGGMORSE_BUILD_EXAMPLES=ON \
            -DSDL2_DIR="$SDL2_CMAKE_DIR" \
            -DSDL2_INCLUDE_DIRS="$SDL2_INCLUDE" \
            -DSDL2_LIBRARIES="$SDL2_LIB" \
            -DSDL2_TESTS=OFF \
            -DSDL2_INSTALL_TESTS=OFF \
            -DGGMORSE_BUILD_TESTS=OFF

      - name: Build
        run: |
          # Deep-patch imgui source for Android GLES2
          python3 << 'PYEOF'
          import os, re

          for root, dirs, files in os.walk('examples/third-party/imgui'):
              for f in files:
                  path = os.path.join(root, f)
                  try:
                      with open(path, 'r', encoding='utf-8') as fh:
                          content = fh.read()
                  except UnicodeDecodeError:
                      with open(path, 'r', encoding='latin-1') as fh:
                          content = fh.read()

                  changed = False

                  # imgui_impl.cpp: remove #include GL/gl3w.h and gl3wInit()
                  if f == 'imgui_impl.cpp':
                      new_content = content.replace(
                          '#include <GL/gl3w.h>    // Initialize with gl3wInit()',
                          '// [PATCHED Android] #include <GL/gl3w.h>'
                      )
                      if new_content != content:
                          content = new_content
                          changed = True
                          print(f'Patched GL/gl3w.h include in: {path}')
                      
                      new_content = content.replace(
                          'bool err = gl3wInit() != 0;',
                          'bool err = false; // [PATCHED Android] gl3wInit() not available on GLES2'
                      )
                      if new_content != content:
                          content = new_content
                          changed = True
                          print(f'Patched gl3wInit() call in: {path}')

                  # imgui_impl_opengl3.h: comment out #error about GL loader
                  if f == 'imgui_impl_opengl3.h':
                      new_content = content.replace(
                          '#error "Cannot detect OpenGL loader!"',
                          '// [PATCHED Android] #error "Cannot detect OpenGL loader!"'
                      )
                      if new_content != content:
                          content = new_content
                          changed = True
                          print(f'Patched #error in: {path}')

                  if changed:
                      with open(path, 'w', encoding='utf-8') as fh:
                          fh.write(content)

          # Also patch the wrong include path in common.cpp
          common_cpp = 'examples/ggmorse-gui/common.cpp'
          if os.path.exists(common_cpp):
              with open(common_cpp, 'r', encoding='utf-8') as fh:
                  c = fh.read()
              # The file has #include "imgui-wrapper/icons_font_awesome.h"
              # but imgui-wrapper is not a submodule; the file is at examples/ggmorse-gui/icons_font_awesome.h
              new_c = c.replace(
                  '#include "imgui-wrapper/icons_font_awesome.h"',
                  '// [PATCHED Android] #include "imgui-wrapper/icons_font_awesome.h"'
              )
              if new_c != c:
                  with open(common_cpp, 'w', encoding='utf-8') as fh:
                      fh.write(new_c)
                  print(f'Patched imgui-wrapper include in: {common_cpp}')

          print("Patching complete")
          PYEOF

          cmake --build build --parallel --clean-first

      - name: Package APK
        run: |
          find build -name "*.so" -exec echo {} \;
          find build -name "ggmorse-gui" -type f -executable -exec echo "Found: {}" \;
          ls -la build/examples/ggmorse-gui/ 2>/dev/null || echo "ggmorse-gui dir not found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ggmorse-android
          path: |
            build/examples/ggmorse-gui/*.apk
            build/examples/ggmorse-gui/ggmorse-gui
            build/examples/ggmorse-gui/libggmorse-gui.so
